<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${item.id != null} ? 'Edit Product' : 'Add New Product'"></title>
    <div th:insert="~{fragments/base :: assetsHead}"></div>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0" th:text="${item.id != null} ? 'Edit Inventory Item' : 'Add New Inventory Item'"></h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="${item.id != null} ? @{/edit/{id}(id=${item.id})} : @{/add}" th:object="${item}" method="post">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" th:field="*{sku}" class="form-control" required>
                            <p th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}" class="text-danger"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                            </div>
                            <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Brand</label>
                            <select th:field="*{brand}" class="form-control" required>
                                <option value="">Select a brand</option>
                                <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" th:text="${item.id != null} ? 'Update Product' : 'Save Product'"></button>
                            <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:insert="~{fragments/base :: assetsScripts}"></div>
</body>
</html>
