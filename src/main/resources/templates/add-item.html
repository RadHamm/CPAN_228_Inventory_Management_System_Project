<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Product - North Point</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h3 class="mb-0">Add New Inventory Item</h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/add}" th:object="${item}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Wireless Mouse" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">SKU</label>
                                <input type="text" th:field="*{sku}" class="form-control" placeholder="e.g. NP-WM-001" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Save Product</button>
                                <a href="/inventory" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
