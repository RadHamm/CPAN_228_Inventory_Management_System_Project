<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"></html>

<head>
        <div th:insert="fragments/base :: assetsHead"></div>
    <title>Add New Product - North Point</title>
</head>
<nav th:replace="fragments/navbar :: navbar"></nav>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h3 class="mb-0">Add New Inventory Item</h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${item.id} != null ? @{/edit/{id}(id=${item.id})} : @{/add}" 
                            th:object="${item}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Wireless Mouse" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Please enter a product name.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">SKU</label>
                                <input type="text" th:field="*{sku}" class="form-control" placeholder="e.g. NP-WM-001" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}">Please enter a valid SKU.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" th:field="*{price}" id="price" class="form-control" placeholder="0.00" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Please enter a valid price.</div>
                                </div>
                            </div>
                            <form th:action="@{/add}" th:object="${item}" method="post">
                                <div class="form-group">
                                    <label for="name">Item Name</label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="Enter name" required>
                                </div>

                            <div class="mb-3">
                                <label class="form-label">Brand</label>
                                <select th:field="*{brand}" class="form-control" th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''" required>
                                    <option value="">Select a brand</option>
                                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"
                                        th:selected="${item.brand != null} ? ${brand.id} == ${item.brand.id} : false">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}">Please select a brand.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Save Product</button>
                                <a href="/inventory" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:insert="fragments/base :: assetsScripts"></div>

</body>
</html>
