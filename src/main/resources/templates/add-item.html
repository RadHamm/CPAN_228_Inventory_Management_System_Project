<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Add New Product</title>
    <div th:insert="fragments/base :: assetsHead"></div>
</head>

<body class="bg-light">

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Add New Inventory Item</h3>
                </div>

                <div class="card-body p-4">

                    <div sec:authorize="!hasAnyRole('ADMIN','STAFF')" class="alert alert-danger">
                        You do not have permission to access this page.
                    </div>

                    <form th:action="@{/add}" th:object="${item}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" th:field="*{sku}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Brand</label>
                            <select th:field="*{brand}" class="form-control" required>
                                <option value="">Select a brand</option>
                                <option th:each="brand : ${brands}"
                                        th:value="${brand.id}"
                                        th:text="${brand.name}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Save Product</button>
                            <a href="/inventory" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:insert="fragments/base :: assetsScripts"></div>
</body>
</html>
