<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>North Point Inventory</title>
    <div th:insert="fragments/base :: assetsHead"></div>
</head>

<body class="bg-light">

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Inventory List</h2>

        <div class="d-flex gap-2 align-items-center">
            <a sec:authorize="hasAnyRole('ADMIN','STAFF')" href="/add" class="btn btn-success">Add New Product</a>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>
    </div>

    <form th:action="@{/inventory}" method="get" class="mb-4 d-flex gap-2">
        <input type="text" name="search" th:value="${search}"
               class="form-control" placeholder="Search by name...">

        <select name="brandId" class="form-control">
            <option value="">All Brands</option>
            <option th:each="b : ${brands}"
                    th:value="${b.id}"
                    th:text="${b.name}"
                    th:selected="${brandId == b.id}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th><a th:href="@{/inventory(sortBy='id', search=${search}, brandId=${brandId})}" class="text-white text-decoration-none">ID</a></th>
            <th><a th:href="@{/inventory(sortBy='name', search=${search}, brandId=${brandId})}" class="text-white text-decoration-none">Product Name</a></th>
            <th><a th:href="@{/inventory(sortBy='sku', search=${search}, brandId=${brandId})}" class="text-white text-decoration-none">SKU</a></th>
            <th><a th:href="@{/inventory(sortBy='price', search=${search}, brandId=${brandId})}" class="text-white text-decoration-none">Price</a></th>
            <th>Brand</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.sku}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}"></td>
            <td th:text="${item.brand != null ? item.brand.name : 'N/A'}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="5" class="text-center text-muted">No items found.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/inventory(page=${currentPage - 1}, search=${search}, sortBy=${sortBy}, brandId=${brandId})}">
                    Previous
                </a>
            </li>

            <li class="page-item disabled">
                <span class="page-link" th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}"></span>
            </li>

            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/inventory(page=${currentPage + 1}, search=${search}, sortBy=${sortBy}, brandId=${brandId})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>

</div>

<div th:insert="fragments/base :: assetsScripts"></div>
</body>
</html>
