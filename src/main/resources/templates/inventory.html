<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>North Point Inventory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventory List</h2>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>

        <form th:action="@{/inventory}" method="get" class="mb-4 d-flex gap-2">
            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by name...">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <table class="table table-striped table-hover shadow-sm bg-white">
            <thead class="table-dark">
                <tr>
                    <th><a th:href="@{/inventory(sortBy='id')}" class="text-white text-decoration-none">ID</a></th>
                    <th><a th:href="@{/inventory(sortBy='name')}" class="text-white text-decoration-none">Product Name</a></th>
                    <th><a th:href="@{/inventory(sortBy='sku')}" class="text-white text-decoration-none">SKU</a></th>
                    <th><a th:href="@{/inventory(sortBy='price')}" class="text-white text-decoration-none">Price</a></th>
                    <th>Brand</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.sku}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}"></td>
                    <td th:text="${item.brand != null ? item.brand.name : 'N/A'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="5" class="text-center text-muted">No items found.</td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/inventory(page=${currentPage - 1}, search=${search}, sortBy=${sortBy})}">Previous</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}"></span>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/inventory(page=${currentPage + 1}, search=${search}, sortBy=${sortBy})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
