<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <div th:insert="fragments/base :: assetsHead"></div>
</head>

<body>

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container mt-5">
    <div class="col-md-4 offset-md-4">
        <div class="card p-4 shadow">

            <h3 class="text-center mb-4">Login to Your Account</h3>

            <div th:if="${param.success}" class="alert alert-success text-center">
                Registration successful! Please login.
            </div>

            <div th:if="${param.error}" class="alert alert-danger text-center">
                Invalid username or password
            </div>

            <div th:if="${param.logout}" class="alert alert-success text-center">
                Logged out successfully
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>

            </form>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="/register">Register here</a>
            </p>

        </div>
    </div>
</div>

<div th:insert="fragments/base :: assetsScripts"></div>

</body>
</html>
