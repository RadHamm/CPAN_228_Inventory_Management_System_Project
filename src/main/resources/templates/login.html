<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"></html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <div th:insert="fragments/base :: assetsHead"></div>

    <title>Login</title>
</head>
<body>
    <nav th:replace="fragments/navbar :: navbar"></nav>

    <p class="mt-2 text-center">
    Don't have an account? <a href="/register">Register here</a>
</p>
<div class="container mt-5">
    <div class="col-md-4 offset-md-4">
        <div class="card p-4">
            <h3 class="text-center mb-4">Login to Your Account</h3>
    <form th:action="@{/login}" method="post">
    <input type="text" name="username" placeholder="Username" class="form-control mb-2">
    <input type="password" name="password" placeholder="Password" class="form-control mb-2">

    <button type="submit" class="btn btn-primary w-100">Login</button>

    <div th:if="${param.error}" class="text-danger mt-2">
        Invalid username or password
    </div>

    <div th:if="${param.logout}" class="text-success mt-2">
        Logged out successfully
    </div>
</form>
        </div>
    </div> 
</div>

<div th:insert="fragments/base :: assetsScripts"></div>
</body>
</html>
